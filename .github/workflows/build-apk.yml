name: Build Debug APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Configure Android SDK environment variables and install required components
        shell: bash
        run: |
          SDK_PATH="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=${SDK_PATH}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${SDK_PATH}" >> "$GITHUB_ENV"
          export ANDROID_HOME="${SDK_PATH}"
          export ANDROID_SDK_ROOT="${SDK_PATH}"
          export PATH="${SDK_PATH}/cmdline-tools/latest/bin:${SDK_PATH}/platform-tools:${PATH}"

          if ! command -v sdkmanager >/dev/null 2>&1; then
            echo "::error::Android sdkmanager not found in ${SDK_PATH}."
            exit 1
          fi

          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install \
            "platform-tools" \
            "build-tools;36.0.0" \
            "platforms;android-36" \
            "platforms;android-36.1"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Verify Gradle Wrapper and prepare debug keystore
        shell: bash
        run: |
          if [ ! -f ./gradlew ]; then
            echo "::error::Gradle Wrapper (./gradlew) is missing in repository root."
            exit 1
          fi
          chmod +x ./gradlew

          if [ ! -f ./debug.keystore ]; then
            if [ -f ./debug.keystore.base64 ]; then
              base64 -d ./debug.keystore.base64 > ./debug.keystore
            else
              keytool -genkeypair -v \
                -keystore ./debug.keystore \
                -storepass android \
                -alias androiddebugkey \
                -keypass android \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

      - name: Build Debug APK(s)
        shell: bash
        run: |
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Verify generated Debug APK(s)
        shell: bash
        run: |
          APK_FILES=$(find . -type f \( -path "*/build/outputs/apk/debug/*.apk" -o -path "*/build/outputs/apk/*/debug/*.apk" \) | sort -u)
          if [ -z "$APK_FILES" ]; then
            echo "::error::Build succeeded but no Debug APK files were found under */build/outputs/apk/**/debug/*.apk."
            exit 1
          fi
          echo "Generated Debug APK(s):"
          echo "$APK_FILES"

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: stress-debug-apk
          path: |
            **/build/outputs/apk/debug/*.apk
            **/build/outputs/apk/*/debug/*.apk
          if-no-files-found: error
          retention-days: 30
